<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="csrf-token" content="{{ csrf }}" />
    <title>FIELDHQ — Member signup</title>
    <script src="/static/theme.js?v=themes-8"></script>
    <link rel="stylesheet" href="/static/base.css" />
    <link rel="stylesheet" href="/static/themes.css?v=themes-8" />
    <link rel="stylesheet" href="/static/login.css" />
    <link rel="stylesheet" href="/static/panel.css?v=workspace-access-1" />
  </head>
  <body class="login-page">
    <main class="login-box" aria-labelledby="signup-title">
      <p class="login-tag">FIELDHQ · Member access</p>
      <img id="signup-icon" alt="Unit icon" width="72" height="72" hidden />
      <h1 id="signup-title">Your unit account</h1>
      <p id="signup-context" role="status">Checking your invitation…</p>
      <form id="signup-form" hidden>
        <div class="field" id="signup-mode-field">
          <label for="signup-mode">Account</label>
          <select id="signup-mode"
            ><option value="new">Create my account</option
            ><option value="existing"
              >Sign in to accept with an existing account</option
            ></select
          >
        </div>
        <div class="field" id="signup-username-field"
          ><label for="signup-username">Username</label
          ><input
            id="signup-username"
            name="username"
            required
            minlength="3"
            maxlength="32"
            pattern="[A-Za-z0-9_.\-]{3,32}"
            autocomplete="username"
          /><small id="signup-username-hint"
            >3–32 characters: letters, numbers, _, . or -</small
          ></div
        >
        <div class="field"
          ><label for="signup-password" id="signup-password-label"
            >Choose a password</label
          ><input
            id="signup-password"
            name="password"
            type="password"
            required
            minlength="10"
            maxlength="72"
            autocomplete="new-password"
          /><small id="signup-password-hint"
            >At least 10 characters; at most 72 UTF-8 bytes.</small
          ></div
        >
        <div class="field" id="signup-confirm-field"
          ><label for="signup-confirm">Confirm password</label
          ><input
            id="signup-confirm"
            name="confirm_password"
            type="password"
            required
            autocomplete="new-password"
        /></div>
        <button class="login-submit" type="submit" id="signup-submit"
          >Create account</button
        >
      </form>
      <p class="login-error" id="signup-error" role="alert" hidden></p>
      <p><a href="/login">Back to sign in</a></p>
      <noscript>Enable JavaScript to accept your invitation.</noscript>
    </main>
    <script src="/static/member-signup.js?v=member-invites-1"></script>
  </body>
</html>
